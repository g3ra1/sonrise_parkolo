services:

  mysql:
    image: mysql:8.4
    container_name: sonrise-mysql
    environment:
      MYSQL_DATABASE: sonrise_parkolo
      MYSQL_USER: sonrise
      MYSQL_PASSWORD: sonrise
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: sonrise-parkolo
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sonrise_parkolo
      SPRING_DATASOURCE_USERNAME: sonrise
      SPRING_DATASOURCE_PASSWORD: sonrise

volumes:
  mysql_data: